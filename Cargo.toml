[package]
name = "fdap"
version = "0.1.0"
edition = "2024"
description = "Exploring the FDAP stack (Flight, DataFusion, Arrow, Parquet) with a functional Query Engine backed by Parquet on MinIO object storage"
license = "Apache-2.0"

[dependencies]
# Core FDAP Stack (aligned on Apache Arrow 59.2 / DataFusion 55.2)
arrow = { version = "59.2.0", features = ["prettyprint", "ipc_compression"] }
arrow-flight = { version = "59.2.0", features = ["flight-sql"] }
parquet = { version = "59.2.0", features = ["arrow", "async", "object_store", "zstd"] }
datafusion = "55.2.0"
object_store = { version = "0.13.2", features = ["aws"] }

# Async runtime & gRPC transport
tokio = { version = "1.44", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.14.1", features = ["gzip", "zstd"] }
prost = "0.14.1"
futures = "0.3"
async-trait = "0.1"
bytes = "1.0"

# Utilities, CLI & Serialization
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
uuid = { version = "1.16", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[[bin]]
name = "fdap-server"
path = "src/bin/fdap-server.rs"

[[bin]]
name = "fdap-cli"
path = "src/bin/fdap-cli.rs"

[[bin]]
name = "fdap-demo"
path = "src/bin/fdap-demo.rs"

[[example]]
name = "01_arrow"
path = "examples/01_arrow.rs"

[[example]]
name = "02_parquet"
path = "examples/02_parquet.rs"

[[example]]
name = "03_datafusion"
path = "examples/03_datafusion.rs"

[[example]]
name = "04_flight"
path = "examples/04_flight.rs"

[[example]]
name = "05_fdap_query_engine"
path = "examples/05_fdap_query_engine.rs"
